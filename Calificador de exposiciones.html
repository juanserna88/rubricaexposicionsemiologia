document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pace-between;gap:20px;padding-bottom:12px;border-bottom:2px solid #013A34;flex-wrap:wrap\">\n    <img src=\"f108b1b0-27c0-4afe-848f-72ae7df88637\" alt=\"Universidad de Manizales\" style=\"height:48px;width:auto\">\n    <img src=\"6b583884-cde4-409f-b6bb-d427b95c7d5b\" alt=\"Acreditación Institucional de Alta Calidad\" style=\"height:30px;width:auto\">\n  <\u002Fdiv>\n\n  <h1 style=\"font-size:26px;letter-spacing:-.015em;color:#013A34;margin:18px 0 4px\">Calificador de exposiciones<\u002Fh1>\n  <p style=\"font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#0A5C52;margin:0 0 22px\">Escala 0 – 5 · Ponderada · Cálculo automático<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;background:#FFFFFF;border:1px solid #D5DEDC;padding:16px;margin-bottom:20px\">\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Estudiante / grupo\n      <input type=\"text\" value=\"{{ meta.estudiante }}\" sc-camel-on-change=\"{{ onMeta }}\" data-k=\"estudiante\" style=\"border:0;border-bottom:1px solid #C9D6D3;padding:7px 2px;font-size:14px;color:#1B2A28;background:transparent\">\n    <\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Asignatura\n      <input type=\"text\" value=\"{{ meta.asignatura }}\" sc-camel-on-change=\"{{ onMeta }}\" data-k=\"asignatura\" style=\"border:0;border-bottom:1px solid #C9D6D3;padding:7px 2px;font-size:14px;color:#1B2A28;background:transparent\">\n    <\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Tema\n      <input type=\"text\" value=\"{{ meta.tema }}\" sc-camel-on-change=\"{{ onMeta }}\" data-k=\"tema\" style=\"border:0;border-bottom:1px solid #C9D6D3;padding:7px 2px;font-size:14px;color:#1B2A28;background:transparent\">\n    <\u002Flabel>\n    <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Fecha\n      <input type=\"date\" value=\"{{ meta.fecha }}\" sc-camel-on-change=\"{{ onMeta }}\" data-k=\"fecha\" style=\"border:0;border-bottom:1px solid #C9D6D3;padding:7px 2px;font-size:14px;color:#1B2A28;background:transparent\">\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:12px\">\n    <div style=\"background:#FFFFFF;border:1px solid #D5DEDC;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 22px;align-items:start\">\n      <div>\n        <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n          <h2 style=\"font-size:16px;color:#013A34;margin:0\">Dominio del contenido y exposición oral<\u002Fh2>\n          <span style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#0A5C52;background:#EAF1EF;padding:3px 8px\">Peso 45 %<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.5;color:#4A5957;margin:8px 0 10px\">Expone con sus propias palabras y usa las diapositivas solo como apoyo. El iPad o el celular se aceptan como consulta puntual: <strong>leer la exposición no es exponer<\u002Fstrong>.<\u002Fp>\n        <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Lectura observada · fija el techo\n          <sc-raw-select value=\"{{ dominio.lectura }}\" sc-camel-on-change=\"{{ dominio.onLectura }}\" style=\"border:1px solid #C9D6D3;padding:8px 9px;font-size:13px;color:#1B2A28;background:#FFFFFF;max-width:100%\">\n            <sc-for list=\"{{ lecturaOpciones }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <option value=\"{{ o.value }}\">{{ o.texto }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:170px\">\n        <div style=\"display:flex;gap:5px\">\n          <sc-for list=\"{{ dominio.botones }}\" as=\"b\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{ b.set }}\" disabled=\"{{ b.off }}\" style=\"width:36px;height:36px;border:1px solid {{ b.borde }};background:{{ b.fondo }};color:{{ b.tinta }};font-size:14px;font-weight:600;cursor:{{ b.cursor }};opacity:{{ b.opacidad }}\">{{ b.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <input type=\"range\" min=\"0\" max=\"5\" step=\"0.1\" value=\"{{ dominio.nota }}\" sc-camel-on-change=\"{{ dominio.onRange }}\" sc-camel-on-input=\"{{ dominio.onRange }}\" style=\"width:120px;accent-color:#013A34\">\n          <span style=\"font-size:15px;font-weight:700;color:#013A34;min-width:34px;text-align:right\">{{ dominio.notaLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:11px;color:#5A6B68\">Aporta {{ dominio.aporte }} pts · techo {{ dominio.techoLabel }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ criterios }}\" as=\"c\" hint-placeholder-count=\"4\">\n      <div style=\"background:#FFFFFF;border:1px solid #D5DEDC;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 22px;align-items:start\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n            <h2 style=\"font-size:16px;color:#013A34;margin:0\">{{ c.nombre }}<\u002Fh2>\n            <span style=\"font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#0A5C52;background:#EAF1EF;padding:3px 8px\">Peso {{ c.pesoLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.5;color:#4A5957;margin:8px 0 0\">{{ c.descriptor }}<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:170px\">\n          <div style=\"display:flex;gap:5px\">\n            <sc-for list=\"{{ c.botones }}\" as=\"b\" hint-placeholder-count=\"6\">\n              <button type=\"button\" sc-camel-on-click=\"{{ b.set }}\" style=\"width:36px;height:36px;border:1px solid {{ b.borde }};background:{{ b.fondo }};color:{{ b.tinta }};font-size:14px;font-weight:600;cursor:pointer\">{{ b.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:8px\">\n            <input type=\"range\" min=\"0\" max=\"5\" step=\"0.1\" value=\"{{ c.nota }}\" sc-camel-on-change=\"{{ c.onRange }}\" sc-camel-on-input=\"{{ c.onRange }}\" style=\"width:120px;accent-color:#013A34\">\n            <span style=\"font-size:15px;font-weight:700;color:#013A34;min-width:34px;text-align:right\">{{ c.notaLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"font-size:11px;color:#5A6B68\">Aporta {{ c.aporte }} pts<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"background:#013A34;color:#FFFFFF;padding:20px;margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;align-items:end\">\n    <div>\n      <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75\">Criterios calificados<\u002Fdiv>\n      <div style=\"font-size:26px;font-weight:600;margin-top:4px\">{{ completados }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75\">Techo por lectura<\u002Fdiv>\n      <div style=\"font-size:26px;font-weight:600;margin-top:4px\">{{ techoGlobal }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.75\">Nota final<\u002Fdiv>\n      <div style=\"font-size:52px;font-weight:700;line-height:1;margin-top:4px\">{{ notaFinal }}<\u002Fdiv>\n      <div style=\"font-size:12.5px;margin-top:6px;opacity:.85\">{{ veredicto }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;border:1px solid #D5DEDC;padding:16px 18px;margin-top:16px\">\n    <label style=\"display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Retroalimentación\n      <textarea rows=\"4\" value=\"{{ meta.comentarios }}\" sc-camel-on-change=\"{{ onMeta }}\" data-k=\"comentarios\" placeholder=\"Fortalezas y aspectos por mejorar…\" style=\"border:1px solid #C9D6D3;padding:10px;font-size:14px;line-height:1.5;color:#1B2A28;resize:vertical\"><\u002Ftextarea>\n    <\u002Flabel>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:10px;margin-top:16px;flex-wrap:wrap\">\n    <button type=\"button\" sc-camel-on-click=\"{{ copiar }}\" style=\"border:1px solid #013A34;background:#013A34;color:#fff;font-size:13px;letter-spacing:.04em;padding:11px 18px;cursor:pointer\">{{ copiarLabel }}<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ reiniciar }}\" style=\"border:1px solid #013A34;background:transparent;color:#013A34;font-size:13px;letter-spacing:.04em;padding:11px 18px;cursor:pointer\">Reiniciar<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"background:#FFFFFF;border:1px solid #D5DEDC;padding:18px;margin-top:16px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px\">\n      <h2 style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#013A34;margin:0\">Configuración de envío<\u002Fh2>\n      <span style=\"font-size:11.5px;color:#0A5C52\">Se guarda en este navegador<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px\">\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">URL del Google Apps Script (Web App)\n        <input type=\"url\" value=\"{{ envio.url }}\" sc-camel-on-change=\"{{ onEnvio }}\" data-k=\"url\" placeholder=\"https://script.google.com/macros/s/AKfycb…/exec\" style=\"border:1px solid #C9D6D3;padding:9px;font-size:13px;color:#1B2A28\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Copia al correo del evaluador\n        <input type=\"email\" value=\"{{ envio.copia }}\" sc-camel-on-change=\"{{ onEnvio }}\" data-k=\"copia\" placeholder=\"docente@umanizales.edu.co\" style=\"border:1px solid #C9D6D3;padding:9px;font-size:13px;color:#1B2A28\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">ID de la Google Sheet (matriz de notas)\n        <input type=\"text\" value=\"{{ envio.sheet }}\" sc-camel-on-change=\"{{ onEnvio }}\" data-k=\"sheet\" placeholder=\"1AbC…\" style=\"border:1px solid #C9D6D3;padding:9px;font-size:13px;color:#1B2A28\">\n      <\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5A6B68\">Correo del estudiante (destinatario)\n        <input type=\"email\" value=\"{{ envio.destino }}\" sc-camel-on-change=\"{{ onEnvio }}\" data-k=\"destino\" placeholder=\"estudiante@umanizales.edu.co\" style=\"border:1px solid #C9D6D3;padding:9px;font-size:13px;color:#1B2A28\">\n      <\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap\">\n      <button type=\"button\" sc-camel-on-click=\"{{ enviar }}\" style=\"border:1px solid #013A34;background:#013A34;color:#fff;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;cursor:pointer\">{{ enviarLabel }}<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ imprimir }}\" style=\"border:1px solid #013A34;background:transparent;color:#013A34;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:12px 20px;cursor:pointer\">Descargar PDF<\u002Fbutton>\n      <span style=\"font-size:12.5px;color:{{ envioTinta }}\">{{ envioEstado }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:2px solid #013A34;margin-top:26px;padding-top:14px\">\n    <div style=\"font-size:14px;font-weight:600;color:#013A34\">Juan David Serna Zuluaga, MD, MSc.<\u002Fdiv>\n    <div style=\"font-size:12.5px;line-height:1.6;color:#4A5957;margin-top:3px\">Médico Magíster en Educación y Transformación Digital<br>Universidad de Manizales · Semiología Médica<\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"font-size:12px;line-height:1.55;color:#5A6B68;margin:20px 0 0\">Ponderación: dominio 45 % · calidad visual 40 % · responsabilidad 10 % · referenciación 5 %. Se exceptúan los ajustes razonables autorizados por la Universidad, informados al docente antes de la exposición.<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst DOMINIO = { k:'oral', peso:0.45 };\n\nconst CRITERIOS = [\n  { k:'visual', nombre:'Calidad visual de las diapositivas', peso:0.40,\n    descriptor:'Diseño limpio y consistente: jerarquía tipográfica clara, texto legible desde el fondo del salón, ideas en frases cortas (no texto corrido), imágenes y tablas pertinentes y de buena resolución.' },\n  { k:'resp', nombre:'Responsabilidad: presentación el día y a la hora pactada', peso:0.10,\n    descriptor:'Se presenta el día y la hora acordados, con el material listo y cargado; cumple el tiempo asignado. Retrasos, cambios de fecha o fallas de material previsibles descuentan.' },\n  { k:'ref', nombre:'Referenciación y calidad de las fuentes', peso:0.05,\n    descriptor:'Diapositivas referenciadas al pie, con guías de práctica clínica vigentes, guías internacionales, revisiones sistemáticas o revistas indexadas; norma única (Vancouver / APA).' }\n];\n\nconst LECTURA = [\n  { v:0, texto:'No usa dispositivo o lo consulta de forma breve y ocasional', efecto:'Sin techo', techo:5, techoGlobal:5 },\n  { v:1, texto:'Lee fragmentos con frecuencia; pierde contacto con el público', efecto:'Techo 4.0', techo:4, techoGlobal:5 },\n  { v:2.5, texto:'Lee la mayor parte de su intervención desde el dispositivo', efecto:'Techo 2.5', techo:2.5, techoGlobal:3.5 },\n  { v:99, texto:'Lee TODO el contenido desde el iPad, computador o celular o las diapositivas', efecto:'Nota final máx. 1.0', techo:1, techoGlobal:1 }\n];\n\nconst KEY = 'um-calificador-v2';\nconst VACIO = { oral:'', visual:'', resp:'', ref:'' };\n\nconst KEY_ENVIO = 'um-calificador-envio-v6';\nconst ENVIO_DEFECTO = {\n  url: 'https://script.google.com/macros/s/AKfycbyTCfgo9O75gE8vUpS6QissEW79Wsz_18sIcGC1XnkdkeFv76Cutlc5L9ruCGRwEUfK/exec',\n  copia: 'jd.serna@umanizales.edu.co',\n  sheet: '1d5JsT0p81nCUKdTTGvHozwzyrnDGXc0Tfy0v-GnZXiI',\n  destino: ''\n};\n\nclass Component extends DCLogic {\n  state = {\n    notas: Object.assign({}, VACIO), lectura: 0,\n    meta:{ estudiante:'', asignatura:'', tema:'', fecha:'', comentarios:'' },\n    envio: Object.assign({}, ENVIO_DEFECTO),\n    estado:'', estadoTipo:'', enviando:false, copiado:false\n  };\n\n  componentDidMount() {\n    try { const raw = localStorage.getItem(KEY); if (raw) this.setState(JSON.parse(raw)); } catch (e) {}\n    try {\n      const e2 = localStorage.getItem(KEY_ENVIO);\n      if (e2) {\n        const g = JSON.parse(e2);\n        // La URL, la copia y la hoja mandan desde el código: solo se conserva el destinatario.\n        this.setState({ envio: Object.assign({}, ENVIO_DEFECTO, { destino: g.destino || '' }) });\n      }\n    } catch (e) {}\n  }\n\n  persist(next) {\n    this.setState(next, () => {\n      try { localStorage.setItem(KEY, JSON.stringify({ notas:this.state.notas, lectura:this.state.lectura, meta:this.state.meta })); } catch (e) {}\n    });\n  }\n\n  persistEnvio(envio) {\n    this.setState({ envio }, () => {\n      try { localStorage.setItem(KEY_ENVIO, JSON.stringify(this.state.envio)); } catch (e) {}\n    });\n  }\n\n  /** JSONP por etiqueta script: evita CORS y devuelve respuesta real del servidor. */\n  enviarJsonp(cfg, payload) {\n    const fn = 'umCB' + Date.now();\n    const s = document.createElement('script');\n    const limpiar = () => {\n      try { delete window[fn]; } catch (e) { window[fn] = undefined; }\n      if (s.parentNode) s.parentNode.removeChild(s);\n      clearTimeout(t);\n    };\n    window[fn] = res => {\n      limpiar();\n      if (res && res.ok) {\n        let msg = 'Enviado a ' + cfg.destino + (cfg.copia ? ' · copia a ' + cfg.copia : '');\n        msg += res.hoja ? ' · registrado en la matriz de notas.' : ' · el correo salió, pero no se pudo escribir en la hoja.';\n        this.setState({ enviando:false, estado:msg, estadoTipo:'ok' });\n      } else {\n        this.setState({ enviando:false, estado:'El script respondió con error: ' + ((res && res.error) || 'desconocido'), estadoTipo:'error' });\n      }\n    };\n    s.src = cfg.url + (cfg.url.indexOf('?') === -1 ? '?' : '&') +\n      'callback=' + fn + '&data=' + encodeURIComponent(JSON.stringify(payload));\n    s.onerror = () => {\n      limpiar();\n      this.setState({ enviando:false, estado:'No se pudo contactar el script. Revisa que la implementación tenga acceso «Cualquier persona» y que la URL termine en /exec.', estadoTipo:'error' });\n    };\n    const t = setTimeout(() => {\n      limpiar();\n      this.setState({ enviando:false, estado:'Sin respuesta del script (30 s). Redesplégalo con «Nueva versión» y acceso «Cualquier persona».', estadoTipo:'error' });\n    }, 30000);\n    document.body.appendChild(s);\n  }\n\n  op() { return LECTURA.find(o => o.v === this.state.lectura) || LECTURA[0]; }\n\n  setLectura(v) {\n    const o = LECTURA.find(x => x.v === v) || LECTURA[0];\n    const d = parseFloat(this.state.notas[DOMINIO.k]);\n    const notas = Object.assign({}, this.state.notas);\n    if (!isNaN(d)) notas[DOMINIO.k] = Math.min(d, o.techo);\n    this.persist({ lectura:o.v, notas, copiado:false });\n  }\n\n  setNota(k, v) {\n    let n = parseFloat(v);\n    if (k === DOMINIO.k && !isNaN(n)) n = Math.min(n, this.op().techo);\n    this.persist({ notas: Object.assign({}, this.state.notas, { [k]: isNaN(n) ? '' : n }), copiado:false });\n  }\n\n  renderVals() {\n    const fmt = n => n.toFixed(1);\n    const op = this.op();\n    const todos = [{ k:DOMINIO.k, peso:DOMINIO.peso }].concat(CRITERIOS);\n\n    let subtotal = 0, hechos = 0;\n    todos.forEach(c => {\n      const n = parseFloat(this.state.notas[c.k]);\n      if (!isNaN(n)) { subtotal += n * c.peso; hechos++; }\n    });\n    const final = Math.max(0, Math.min(op.techoGlobal, subtotal));\n\n    const botones = (k, nota, has, techo) => [0,1,2,3,4,5].map(v => {\n      const sel = has && Math.round(nota) === v;\n      const off = v > techo;\n      return {\n        label: String(v), off,\n        cursor: off ? 'not-allowed' : 'pointer',\n        opacidad: off ? '0.35' : '1',\n        fondo: sel ? '#013A34' : '#FFFFFF',\n        tinta: sel ? '#FFFFFF' : '#1B2A28',\n        borde: sel ? '#013A34' : '#C9D6D3',\n        set: off ? () => {} : () => this.setNota(k, v)\n      };\n    });\n\n    const dn = parseFloat(this.state.notas[DOMINIO.k]);\n    const dHas = !isNaN(dn);\n    const dominio = {\n      nota: dHas ? dn : 0,\n      notaLabel: dHas ? fmt(dn) : '—',\n      techoLabel: fmt(op.techo),\n      aporte: dHas ? (dn * DOMINIO.peso).toFixed(2) : '0.00',\n      lectura: String(this.state.lectura),\n      onLectura: e => this.setLectura(parseFloat(e.target.value)),\n      onRange: e => this.setNota(DOMINIO.k, e.target.value),\n      botones: botones(DOMINIO.k, dn, dHas, op.techo)\n    };\n\n    const criterios = CRITERIOS.map(c => {\n      const n = parseFloat(this.state.notas[c.k]);\n      const has = !isNaN(n);\n      return {\n        nombre: c.nombre, descriptor: c.descriptor,\n        pesoLabel: Math.round(c.peso * 100) + ' %',\n        nota: has ? n : 0,\n        notaLabel: has ? fmt(n) : '—',\n        aporte: has ? (n * c.peso).toFixed(2) : '0.00',\n        onRange: e => this.setNota(c.k, e.target.value),\n        botones: botones(c.k, n, has, 5)\n      };\n    });\n\n    const lecturaOpciones = LECTURA.map(o => ({\n      value: String(o.v),\n      texto: o.texto + ' — ' + o.efecto\n    }));\n\n    let veredicto = final >= 4.5 ? 'Desempeño superior' : (final >= 3.0 ? 'Aprobado' : 'No aprobado');\n    if (op.v === 99) veredicto = 'No aprobado — leyó todo el contenido';\n\n    return {\n      dominio, criterios, lecturaOpciones,\n      meta: this.state.meta,\n      completados: hechos + ' / 4',\n      techoGlobal: op.v === 0 ? 'sin techo' : fmt(op.techoGlobal),\n      notaFinal: fmt(final),\n      veredicto,\n      copiarLabel: this.state.copiado ? 'Resumen copiado' : 'Copiar resumen',\n      onMeta: e => {\n        const k = e.target.getAttribute('data-k');\n        this.persist({ meta: Object.assign({}, this.state.meta, { [k]: e.target.value }) });\n      },\n      copiar: () => {\n        const lines = [\n          'Rúbrica de evaluación de exposiciones — Universidad de Manizales',\n          'Estudiante/grupo: ' + (this.state.meta.estudiante || '—'),\n          'Asignatura: ' + (this.state.meta.asignatura || '—') + '   Tema: ' + (this.state.meta.tema || '—'),\n          'Fecha: ' + (this.state.meta.fecha || '—'), ''\n        ];\n        lines.push('Dominio del contenido y exposición oral (45%): ' + (dHas ? fmt(dn) : '—'));\n        CRITERIOS.forEach(c => {\n          const n = parseFloat(this.state.notas[c.k]);\n          lines.push(c.nombre + ' (' + Math.round(c.peso*100) + '%): ' + (isNaN(n) ? '—' : fmt(n)));\n        });\n        lines.push('', 'Lectura desde dispositivo: ' + op.texto + ' (' + op.efecto + ')');\n        lines.push('NOTA FINAL: ' + fmt(final) + ' — ' + veredicto);\n        if (this.state.meta.comentarios) lines.push('', 'Retroalimentación: ' + this.state.meta.comentarios);\n        try {\n          navigator.clipboard.writeText(lines.join('\\n'));\n          this.setState({ copiado:true });\n          setTimeout(() => this.setState({ copiado:false }), 2200);\n        } catch (e) {}\n      },\n      envio: this.state.envio,\n      enviarLabel: this.state.enviando ? 'Enviando…' : 'Enviar resultado por email',\n      envioEstado: this.state.estado,\n      envioTinta: this.state.estadoTipo === 'error' ? '#7A1B14' : '#0A5C52',\n      onEnvio: e => {\n        const k = e.target.getAttribute('data-k');\n        this.persistEnvio(Object.assign({}, this.state.envio, { [k]: e.target.value.trim() }));\n      },\n      imprimir: () => window.print(),\n      enviar: () => {\n        const cfg = this.state.envio;\n        if (!cfg.url) return this.setState({ estado:'Falta la URL del Google Apps Script.', estadoTipo:'error' });\n        if (!cfg.destino) return this.setState({ estado:'Falta el correo del estudiante.', estadoTipo:'error' });\n        if (hechos < 4) return this.setState({ estado:'Califica los 4 criterios antes de enviar.', estadoTipo:'error' });\n        const payload = {\n          sheetId: cfg.sheet,\n          para: cfg.destino,\n          cc: cfg.copia,\n          asunto: 'Resultado de exposición — ' + (this.state.meta.asignatura || 'Semiología Médica'),\n          evaluador: 'Juan David Serna Zuluaga, MD, MSc.',\n          estudiante: this.state.meta.estudiante,\n          asignatura: this.state.meta.asignatura,\n          tema: this.state.meta.tema,\n          fecha: this.state.meta.fecha,\n          notas: {\n            dominio: dHas ? +fmt(dn) : null,\n            visual: parseFloat(this.state.notas.visual),\n            responsabilidad: parseFloat(this.state.notas.resp),\n            referenciacion: parseFloat(this.state.notas.ref)\n          },\n          lectura: op.texto,\n          efectoLectura: op.efecto,\n          notaFinal: +fmt(final),\n          veredicto: veredicto,\n          comentarios: this.state.meta.comentarios,\n          enviadoEn: new Date().toISOString()\n        };\n        this.setState({ enviando:true, estado:'Enviando…', estadoTipo:'' });\n        this.enviarJsonp(cfg, payload);\n      },\n      reiniciar: () => this.persist({ notas: Object.assign({}, VACIO), lectura:0, meta:{ estudiante:'', asignatura:'', tema:'', fecha:'', comentarios:'' } })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
